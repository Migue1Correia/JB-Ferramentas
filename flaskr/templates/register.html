<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concluir Cadastro - JB Ferramentas</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

    <div class="bg-container-register"></div>

    <div class="container">

        <!-- LOGO -->
        <div class="logo-area">

            <img
                src="{{ url_for('static', filename='img/logo.png') }}"
                alt="JB Ferramentas"
                class="logo-img"
            >

        </div>

        <!-- FORMULÁRIO -->
        <div class="login-area">

            <h2>Concluir Cadastro</h2>

            {% if status %}
                <div class="alert-overlay">
                    <div class="alert-modal" role="alert">
                        <p>{{ status }}</p>
                        <a href="/register" class="alert-btn">
                          FECHAR
                        </a>
                    </div>  
                </div>
            {% endif %}

            <form method="POST" action="/register" id="form_cadastro">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- NOME -->
                <div class="input-group">
                    <label for="id_nome">Nome Completo</label>

                    <input
                        type="text"
                        name="nome"
                        id="id_nome"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>

                <!-- CPF -->
                <div class="input-group">
                    <label for="id_codigo">CPF/CNPJ</label>

                    <input
                        type="text"
                        name="code"
                        id="id_codigo"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        autocomplete="off"
                        aria-describedby="id_codigo_erro"
                        required
                    >
                    <span class="input-erro" id="id_codigo_erro" aria-live="polite"></span>

                </div>

                <!-- CEP (preenche o endereço automaticamente via ViaCEP) -->
                <div class="input-group">
                    <label for="id_cep">CEP</label>

                    <input
                        type="text"
                        id="id_cep"
                        placeholder="00000-000"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        aria-describedby="id_cep_erro id_cep_status"
                    >
                    <span class="input-erro" id="id_cep_erro" aria-live="polite"></span>
                    <span class="input-status" id="id_cep_status" aria-live="polite"></span>
                </div>

                <!-- ENDEREÇO -->
                <div class="input-group">
                    <label for="id_endereco">Endereço</label>

                    <input
                        type="text"
                        name="endereco"
                        id="id_endereco"
                        placeholder="Rua, bairro - cidade/UF"
                        autocomplete="street-address"
                        required
                    >
                </div>

                <!-- NÚMERO -->
                <div class="input-group">
                    <label for="id_numero">Número / complemento</label>

                    <input
                        type="text"
                        id="id_numero"
                        placeholder="Ex.: 123, apto 4"
                    >
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <label for="id_email">E-mail</label>

                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <!-- TELEFONE -->
                <div class="input-group">
                    <label for="id_telefone">Telefone com DDD</label>

                    <input
                        type="text"
                        name="telefone"
                        id="id_telefone"
                        placeholder="(11) 99999-9999"
                        inputmode="tel"
                        autocomplete="tel"
                        aria-describedby="id_telefone_erro"
                        required
                    >
                    <span class="input-erro" id="id_telefone_erro" aria-live="polite"></span>
                </div>

                <!-- TIPO -->
                <div class="radio-group">

                    <h4>Tipo de Pessoa</h4>

                    <div class="radio-options">

                        <label>
                            <input
                                type="radio"
                                id="pf"
                                name="tipo"
                                value="pf"
                                checked
                            >
                            Pessoa Física
                        </label>

                        <label>
                            <input
                                type="radio"
                                id="pj"
                                name="tipo"
                                value="pj"
                            >
                            Pessoa Jurídica
                        </label>

                    </div>

                </div>

                <!-- USUARIO -->
                <div class="input-group">
                    <label for="id_usuario">Usuário</label>

                    <input
                        type="text"
                        name="usuario"
                        id="id_usuario"
                        placeholder="@seuusuario"
                        required
                    >
                </div>

                <!-- SENHA -->
                <div class="input-group">
                    <label for="id_senha">Senha</label>

                    <input
                        type="password"
                        name="senha"
                        id="id_senha"
                        placeholder="************"
                        required
                    >
                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-login">
                    CONCLUIR CADASTRO
                </button>

            </form>

            <!-- LINKS -->
            <div class="links">
                <div class="register">
                    <a href="{{ url_for('login') }}" style="color: inherit; text-decoration: none; font-weight: bold;">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar para login
                    </a>
                </div>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>
</html>
