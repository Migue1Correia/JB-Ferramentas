<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JB Ferramentas: venda, aluguel e manutenção de ferramentas, com atendimento na matriz e nas filiais.">
    <title>JB Ferramentas - Editar peça</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styleJB.css') }}?v=4.7">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/movimento.css') }}?v=1.0">
    <script src="{{ url_for('static', filename='js/movimento.js') }}?v=1.0" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="dashboard-body">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
{% include '_topo_colaborador.html' %}

    <main id="conteudo" class="dashboard-content">
        <section class="profile-card">
            <div class="card-header">
                <i class="fas fa-pen" aria-hidden="true"></i>
                <h1 style="font-size: 1.3rem;">Editar {{ peca.nome }}</h1>
            </div>
            <form method="POST" action="{{ url_for('editar_peca', id_peca=peca.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" maxlength="100" value="{{ peca.nome }}" required>
                    </div>
                    <div class="input-group">
                        <label for="fabricante">Fabricante</label>
                        <input type="text" id="fabricante" name="fabricante" maxlength="100" value="{{ peca.fabricante }}" required>
                    </div>
                    <div class="input-group full-width">
                        <label for="codigo_barras">Código de barras (não pode repetir)</label>
                        <input type="text" id="codigo_barras" name="codigo_barras" maxlength="20" value="{{ peca.codigo }}" required>
                    </div>
                    <div class="input-group">
                        <label for="custo">Custo (R$)</label>
                        <input type="number" id="custo" name="custo" min="0" step="0.01" value="{{ '%.2f'|format(peca.custo) }}" required>
                    </div>
                    <div class="input-group">
                        <label for="preco_venda">Preço de venda (R$)</label>
                        <input type="number" id="preco_venda" name="preco_venda" min="0" step="0.01" value="{{ '%.2f'|format(peca.preco) }}" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save"><i class="fas fa-save" aria-hidden="true"></i> Salvar alterações</button>
                    <a href="{{ url_for('gerenciar_pecas') }}" class="btn-save" style="background: #333333; text-decoration: none;">Cancelar</a>
                </div>
            </form>
        </section>

        <section class="profile-card">
            <div class="card-header">
                <i class="fas fa-store" aria-hidden="true"></i>
                <h2>Colocar em outra filial</h2>
            </div>
            <form method="POST" action="{{ url_for('peca_em_filial', id_peca=peca.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="id_filial">Filial</label>
                        <select id="id_filial" name="id_filial" required>
                            {% for filial in filiais %}
                            <option value="{{ filial[0] }}">{{ filial[2] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="quantidade">Quantidade em estoque</label>
                        <input type="number" id="quantidade" name="quantidade" min="0" step="1" value="0" required>
                    </div>
                    <div class="input-group">
                        <label for="minimo">Estoque mínimo</label>
                        <input type="number" id="minimo" name="minimo" min="0" step="1" value="0" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save"><i class="fas fa-plus" aria-hidden="true"></i> Colocar na filial</button>
                </div>
            </form>
        </section>

        <section class="profile-card">
            <div class="card-header">
                <i class="fas fa-trash" aria-hidden="true"></i>
                <h2>Excluir peça</h2>
            </div>
            <p style="color: #aaaaaa; margin-bottom: 16px;">Apaga a peça e o estoque dela em todas as filiais. Peça já usada em alguma manutenção não pode ser excluída.</p>
            <form method="POST" action="{{ url_for('excluir_peca', id_peca=peca.id) }}" onsubmit="return confirm('Excluir ' + {{ peca.nome|tojson|forceescape }} + ' e o estoque dela?')">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn-remover">Excluir esta peça</button>
            </form>
        </section>
    </main>
</body>
</html>
