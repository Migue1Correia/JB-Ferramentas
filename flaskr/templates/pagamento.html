<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Ferramentas - Pagamento do orçamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styleJB.css') }}?v=4.2">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="bg-container-perfil"></div>

    <header class="dashboard-header">
        {% include '_topo.html' %}
    </header>

    <main id="conteudo" class="profile-container">
        {% include '_mensagens.html' %}

        <section class="profile-card">
            <div class="card-header">
                <i class="fas fa-credit-card" aria-hidden="true"></i>
                <h1 style="font-size: 1.3rem;">Como você quer pagar?</h1>
            </div>

            <p style="color: #cccccc; line-height: 1.6;">
                Você está aprovando o orçamento da manutenção #{{ orcamento.id }} ({{ orcamento.descricao }}).
            </p>
            <p class="price" style="font-size: 2rem; margin: 16px 0 24px;">{{ orcamento.valor|moeda }}</p>

            <form method="POST" action="{{ url_for('responder_orcamento', id_servico=orcamento.id, resposta='Aprovado') }}" class="form-actions" style="margin-top: 0;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" name="pagamento" value="agora" class="btn-save">
                    <i class="fas fa-cart-shopping" aria-hidden="true"></i> Pagar agora (vai para o carrinho)
                </button>
                <button type="submit" name="pagamento" value="retirada" class="btn-save" style="background: #333333;">
                    <i class="fas fa-store" aria-hidden="true"></i> Pagar na retirada do equipamento
                </button>
            </form>

            <p style="margin-top: 24px;">
                <a href="{{ url_for('perfil_page') }}" style="color: #aaaaaa;">Voltar sem aprovar</a>
            </p>
        </section>
    </main>
</body>
</html>
