<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo JB - Compra e Aluguel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loja.css') }}?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">
    <div class="bg-container-loja"></div>

    <header class="dashboard-header">
        <div class="header-top-bar">
            <a href="{{ url_for('main_page') }}" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="user-icon-top">
                <i class="fas fa-user-circle"></i>
            </div>
        </div>

        <section class="logo-section">
            <div class="logo-wrapper">
                <div class="logo-box">
                    <h1>JB</h1>
                </div>
                <h2 class="company-subname">FERRAMENTAS</h2>
                <div class="tool-icons-row">
                    <i class="fas fa-screwdriver"></i>
                    <i class="fas fa-wrench"></i>
                    <i class="fas fa-hammer"></i>
                </div>
            </div>
        </section>
    </header>

    <main class="dashboard-content">
        <section class="welcome-box">
            <h1>Catálogo de Ferramentas</h1>
            <p>Escolha entre comprar equipamentos novos ou alugar por diária.</p>
        </section>

        <div class="filter-bar">
            <button class="filter-btn active">Todos</button>
            <button class="filter-btn">Para Comprar</button>
            <button class="filter-btn">Para Alugar</button>
        </div>

        <div class="products-grid">
            {% for item in ferramentas %}
            <div class="product-card" data-tipo="{{ item.tipo|lower }}">
                <img src="{{ url_for('static', filename='img/produto.png') }}" alt="{{ item.nome }}">
                <div class="prod-details">
                    <h3>{{ item.nome }}</h3>
                    <p class="price">R$ {{ item.preco }}{% if item.tipo|lower == 'alugar' %}/dia{% endif %}</p>
                    <a href="{{ url_for('detalhe_produto', id=item.id) }}" style="text-decoration: none; width: 100%;">
                        <button class="{% if item.tipo|lower == 'alugar' %}btn-buy{% else %}btn-dark{% endif %}">
                            {{ item.tipo }}
                        </button>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <script>
        const filters = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.product-card');

        filters.forEach(filter => {
            filter.addEventListener('click', () => {
                filters.forEach(btn => btn.classList.remove('active'));
                filter.classList.add('active');

                const categoria = filter.textContent.toLowerCase();

                cards.forEach(card => {
                    const cardTipo = card.getAttribute('data-tipo');
                    
                    if (categoria === 'todos' || 
                       (categoria.includes('comprar') && cardTipo !== 'alugar') || 
                       (categoria.includes('alugar') && cardTipo === 'alugar')) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
