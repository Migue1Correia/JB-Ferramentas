<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='bodyferramentas.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Catálogo JB - Compra e Aluguel</title>
</head>
<body class="dark-theme">
    <header class="header-main">
        <div class="nav-icons">
            <a href="{{ url_for('main_page') }}" class="icon-link"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
        <div class="logo">
            <img src="{{ url_for('static', filename='jb_logo.png') }}" alt="JB Ferramentas">
        </div>
        <div class="user-access">
            <a href="{{ url_for('main_page') }}" class="icon-link"> <i class="fa-solid fa-user"></i></a>
        </div>
    </header>

    <main class="container">
        <section class="welcome-section">
            <h1>Catálogo de Ferramentas</h1>
            <p>Escolha entre comprar equipamentos novos ou alugar por diária.</p>
        </section>

        <div class="filter-bar">
            <button class="filter-btn active">Todos</button>
            <button class="filter-btn">Para Comprar</button>
            <button class="filter-btn">Para Alugar</button>
        </div>

        <div class="grid-ferramentas">
            {% for item in ferramentas %}
            <div class="card-ferramenta" data-tipo="{{ item.tipo|lower }}">
                <div class="img-container">
                    <img src="{{ url_for('static', filename='produto3.png') }}" alt="{{ item.nome }}">
                </div>
                <div class="info">
                    <div class="text-info">
                        <p class="tool-name">{{ item.nome }}</p>
                        <span class="tool-price">R$ {{ item.preco }}{% if item.tipo|lower == 'alugar' %}/dia{% endif %}</span>
                    </div>
                    
                    <a href="{{ url_for('detalhe_produto', id=item.id) }}" class="btn-action btn-{{ item.tipo|lower }}">
                        {{ item.tipo }}
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <script>
        const filters = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.card-ferramenta');

        filters.forEach(filter => {
            filter.addEventListener('click', () => {
                // Estilização do botão ativo
                filters.forEach(btn => btn.classList.remove('active'));
                filter.classList.add('active');

                const categoria = filter.textContent.toLowerCase();

                cards.forEach(card => {
                    const cardTipo = card.getAttribute('data-tipo');
                    
                    // Lógica: se for 'todos', mostra tudo. 
                    // Se clicar em 'Para Comprar', filtra apenas por 'comprar'.
                    if (categoria === 'todos' || categoria.includes(cardTipo)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
