<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos e Locações - JB Ferramentas</title>
    <!-- Importação do CSS exclusivo desta tela -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pedidos.css') }}">
    <!-- Necessário caso o base não importe o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #ffffff;">
    
    {% include '_header.html' %}

    <main class="container py-5 jb-pedidos-container">

        <a href="javascript:history.back()" class="text-decoration-none text-secondary mb-3 d-inline-block jb-btn-voltar">
            <i class="fas fa-arrow-left me-1"></i> Voltar
        </a>

        <!-- Título corrigido para texto escuro -->
        <h2 class="mb-4 fw-bold text-dark"><i class="fas fa-clipboard-list text-danger me-2"></i> Gestão de Pedidos</h2>

        <!-- Navegação das Abas -->
        <ul class="nav nav-tabs jb-tabs mb-4" id="pedidosTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="locacoes-tab" data-bs-toggle="tab" data-bs-target="#locacoes" type="button" role="tab">
                    <i class="fas fa-hard-hat me-1"></i> Locações
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="compras-tab" data-bs-toggle="tab" data-bs-target="#compras" type="button" role="tab">
                    <i class="fas fa-shopping-cart me-1"></i> Compras
                </button>
            </li>
        </ul>

        <!-- Conteúdo das Abas -->
        <div class="tab-content" id="pedidosTabContent">
            
            <!-- Aba de Locações -->
            <div class="tab-pane fade show active" id="locacoes" role="tabpanel">
                <div class="table-responsive jb-table-wrapper">
                    <!-- Tabela corrigida (removido table-dark, adicionado jb-table) -->
                    <table class="table table-hover align-middle jb-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Cliente</th>
                                <th>Equipamento (Locação)</th>
                                <th>Data Retirada</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Exemplo de Linha -->
                            <tr>
                                <td class="text-muted fw-bold">#LOC-001</td>
                                <td>João Silva</td>
                                <td>Martelete Rompedor Bosch</td>
                                <td>26/10/2026</td>
                                <td><span class="badge bg-warning text-dark">Em uso</span></td>
                                <td>
                                    <!-- Botão corrigido para btn-outline-dark -->
                                    <button class="btn btn-sm btn-outline-dark"><i class="fas fa-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Aba de Compras -->
            <div class="tab-pane fade" id="compras" role="tabpanel">
                <div class="table-responsive jb-table-wrapper">
                    <!-- Tabela corrigida (removido table-dark, adicionado jb-table) -->
                    <table class="table table-hover align-middle jb-table">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Cliente</th>
                                <th>Itens</th>
                                <th>Valor Total</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Exemplo de Linha -->
                            <tr>
                                <td class="text-muted fw-bold">#PED-992</td>
                                <td>Maria Oliveira</td>
                                <td>Furadeira Makita, Brocas (x3)</td>
                                <td class="text-success fw-bold">R$ 450,00</td>
                                <td><span class="badge bg-success">Pago</span></td>
                                <td>
                                    <!-- Botão corrigido para btn-outline-dark -->
                                    <button class="btn btn-sm btn-outline-dark"><i class="fas fa-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
    
    <!-- Script do Bootstrap para fazer a troca de abas funcionar -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
