<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
  <a href="/">Voltar</a>
  <h3>{{ status }}</h3>
  <label for="id_login">Login</label>
  <form method="post" action="/login" id="id_login">
    <label for="id_usuario">Usuario: </label>
    <input type="email" name="usuario" id="id_usuario" required>
    <input type="password" name="senha" id="id_senha" required>
    <input type="submit" value="Entrar">
  </form>
</body>
</html>
