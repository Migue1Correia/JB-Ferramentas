{# Card de menu do Painel de gráficos. É incluído nos menus das outras telas com
    {% include '_card_painel.html' %}. #}
{% if pode_ver_painel %}
<div class="col-md-6 offset-md-3 mt-3">
    <a href="{{ url_for('painel_graficos') }}" class="text-decoration-none">
        <div class="service-card-painel p-4 bg-white shadow-sm rounded-4 border h-100" style="border-left: 6px solid #FBC02D !important;">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <i class="fas fa-chart-line fs-1" style="color: #FBC02D;"></i>
                    <div>
                        <h3 class="h5 fw-bold mb-1 text-dark">Painel</h3>
                        <p class="text-muted small mb-0">Gráficos de vendas, aluguéis e manutenções.</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-secondary"></i>
            </div>
        </div>
    </a>
</div>
{% endif %}
