{# Card de menu do Painel de gráficos #}
{% if pode_ver_painel %}
<div class="col-md-6 offset-md-3 mt-3">
    <a href="{{ url_for('painel_graficos') }}" class="text-decoration-none">
        <div class="service-card-item service-card-painel p-4 bg-white rounded-4 h-100">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <i class="fas fa-chart-line fs-1 text-warning icon-painel"></i>
                    <div>
                        <h3 class="h5 fw-bold mb-1 text-dark">Painel</h3>
                        <p class="text-muted small mb-0">Gráficos de vendas, aluguéis e manutenções.</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-secondary"></i>
            </div>
        </div>
    </a>
</div>
{% endif %}
