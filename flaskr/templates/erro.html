<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Ferramentas - {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styleJB.css') }}?v=4.5">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="dashboard-body">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="bg-container-perfil"></div>

    <header class="dashboard-header">
        {% include '_topo.html' %}
    </header>

    <main id="conteudo" class="profile-container">
        <section class="profile-card">
            <div class="card-header">
                <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
                <h1 style="font-size: 1.3rem;">{{ titulo }}</h1>
            </div>
            <p style="color: #cccccc; line-height: 1.6; margin-bottom: 24px;">{{ mensagem }}</p>
            <a href="{{ url_for('ferramentas_page') }}" class="btn-save" style="display: inline-block; text-decoration: none;">
                <i class="fas fa-home" aria-hidden="true"></i> Voltar para o início
            </a>
        </section>
    </main>
</body>
</html>
