<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Ferramentas - Concluir Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="bg-container-cadastro"></div>

    <main class="page-container">
        <div class="logo-section">
            <div class="logo-box">
                <h1>JB</h1>
            </div>
            <p>FERRAMENTAS</p>
        </div>

        <div class="form-card">
            <h2 class="form-title">Concluir Cadastro</h2>

            {% if status %}
                <p class="status-msg">{{ status }}</p>
            {% endif %}

            <form action="/register" method="POST">
                
                <div class="input-field">
                    <label>Nome Completo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user main-icon"></i>
                        <input type="text" name="nome" placeholder="Seu nome" required>
                        <i class="fas fa-pencil-alt side-icon"></i>
                    </div>
                </div>

                <div class="input-field">
                    <label>CPF</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card main-icon"></i>
                        <input type="text" name="codigo" placeholder="000.000.000-00" required>
                        <i class="fas fa-pencil-alt side-icon"></i>
                    </div>
                </div>

                <div class="input-field">
                    <label>ENDEREÇO</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card main-icon"></i>
                        <input type="text" name="ENDERECO" placeholder="Seu endereço" required>
                        <i class="fas fa-pencil-alt side-icon"></i>
                    </div>
                </div>

                <div class="input-field">
                    <label>E-mail</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope main-icon"></i>
                        <input type="email" name="email" placeholder="email@exemplo.com" required>
                        <i class="fas fa-pencil-alt side-icon"></i>
                    </div>
                </div>

                <div class="input-field">
                    <label>Telefone com DDD</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone main-icon"></i>
                        <input type="text" name="telefone" placeholder="(00) 00000-0000" required>
                        <i class="fas fa-pencil-alt side-icon"></i>
                    </div>
                </div>

                <div class="input-field">
                    <label>Usuário</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at main-icon"></i>
                        <input type="text" name="usuario" placeholder="@seunome" required>
                        <i class="fas fa-pencil-alt side-icon"></i>
                    </div>
                </div>

                <div class="input-field">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock main-icon"></i>
                        <input type="password" name="senha" placeholder="••••••••" required>
                        <i class="fas fa-eye-slash side-icon"></i>
                    </div>
                </div>

                <input type="hidden" name="tipo" value="pf">
                <input type="hidden" name="endereco" value="Não informado">

                <button type="submit" class="btn-primary">CADASTRAR</button>
            </form>

            <div class="footer-links">
                <p>Já possui uma conta? <a href="{{ url_for('login_view') }}" class="link-amarelo">Entrar</a></p>
            </div>
        </div>
    </main>
</body>
</html>
