<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Ferramentas - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="bg-container-tela-inicial"></div>
    
    <div class="main-wrapper">
        <section class="logo-section">
            <div class="logo-box">
                <h1>JB</h1>
            </div>
            <p>FERRAMENTAS</p>
        </section>

        <section class="form-card">
            <h2>Bem-vindo(a)</h2>
            <form action="/login" method="POST">
                <div class="input-group">
                    <label>CPF ou CNPJ</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="usuario" placeholder="Digite seu CPF ou CNPJ" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="senha" placeholder="Digite sua senha" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">ENTRAR</button>
            </form>
            <div class="footer-links">
                <a href="#">Esqueceu sua senha?</a><br><br>
                <p>Primeiro acesso? 
                    <a href="{{ url_for('register') }}" class="link-amarelo">Concluir cadastro.</a>
                </p>
            </div>
        </section>
    </div>
</body>
</html>
